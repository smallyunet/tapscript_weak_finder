[package]
name = "tapscript-weak-finder"
version = "0.1.0"
edition = "2024"
description = "Read-only, resumable Bitcoin TapScript audit scanner"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = "3.4"
hex = "0.4"
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ripemd = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
secp256k1 = { version = "0.31", features = ["global-context"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
